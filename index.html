<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Time Tracker</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light dark
}

body{
  margin:0;
  background:#f4f4f7;
  color:#17171a
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  padding:24px 18px;
  box-sizing:border-box
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px
}

h1{
  font-size:25px;
  margin:0
}

.clock{
  font-variant-numeric:tabular-nums;
  font-size:18px;
  color:#666
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:24px;
  padding:22px;
  margin-bottom:16px
}

.center{
  text-align:center
}

.actions{
  display:flex;
  gap:14px;
  justify-content:center;
  align-items:center
}

.tap{
  width:190px;
  height:190px;
  flex:0 0 190px;
  border-radius:50%;
  border:0;
  background:#111;
  color:#fff;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 24px #0002
}

.tap:active{
  transform:scale(.97)
}

.sub{
  color:#777;
  font-size:14px;
  margin-top:14px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #eee
}

.row:last-child{
  border-bottom:0
}

.time{
  font-variant-numeric:tabular-nums;
  font-weight:700
}

.topic{
  color:#555
}

.btn{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:1px solid #ccc;
  background:#fff;
  font-weight:600;
  cursor:pointer
}

.danger{
  color:#b00020
}

.empty{
  color:#777;
  text-align:center;
  padding:15px
}

.report{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:0;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

dialog{
  border:0;
  border-radius:22px;
  padding:22px;
  max-width:calc(100% - 44px);
  width:360px
}

dialog::backdrop{
  background:#0007
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
  margin:12px 0
}

.dialog-actions{
  display:flex;
  gap:10px
}

.dialog-actions button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc
}

.primary{
  background:#111!important;
  color:#fff;
  border-color:#111!important
}

@media(prefers-color-scheme:dark){
  body{
    background:#111;
    color:#eee
  }

  .card{
    background:#1c1c1e;
    border-color:#333
  }

  .btn,
  input{
    background:#242426;
    color:#eee;
    border-color:#444
  }

  .topic,
  .sub,
  .clock{
    color:#aaa
  }

  .row{
    border-color:#333
  }

  dialog{
    background:#1c1c1e;
    color:#eee
  }
}
</style>
</head>

<body>

<main class="app" id="app">

<header>
  <h1>ثبت زمان</h1>
  <div class="clock" id="clock">--:--:--</div>
</header>


<!--
  این بخش دو نوع ثبت اصلی برنامه را در اختیار کاربر می‌گذارد:

  1. ثبت زمان:
     فقط یک لحظه را ثبت می‌کند.
     مثال:
     ساعت 10:30 → مطالعه KNN

  2. ثبت کار:
     برای کاری است که شروع و پایان دارد.
     مثال:
     ساعت 10:30 شروع مطالعه KNN
     ساعت 12:00 پایان مطالعه KNN
-->
<section class="card center">

  <div class="actions">

    <button class="tap" id="tap">
      ثبت زمان
    </button>

    <button class="tap" id="taskTap">
      ثبت کار
    </button>

  </div>

  <div class="sub">
    «ثبت زمان» یک لحظه را ثبت می‌کند؛
    «ثبت کار» برای کاری است که شروع و پایان دارد.
  </div>

</section>


<!--
  بخش اهداف فردا:

  هر هدف دو اطلاعات اصلی دارد:

  text
  متن خود هدف

  done
  مشخص می‌کند هدف انجام شده یا نه.

  هدف‌های انجام‌نشده بعداً می‌توانند
  داخل پنجره ثبت فعالیت به عنوان پیشنهاد ظاهر شوند.
-->
<section class="card">

  <h2 style="font-size:18px;margin-top:0">
    اهداف فردا
  </h2>

  <div class="actions">

    <input
      id="goalInput"
      maxlength="120"
      placeholder="مثلاً ۱ ساعت AI"
      autocomplete="off"
    >

    <button
      class="primary btn"
      id="addGoal"
    >
      افزودن هدف
    </button>

  </div>

  <div id="goals"></div>

</section>


<!--
  این قسمت ثبت‌های لحظه‌ای را نمایش می‌دهد.
-->
<section class="card">

  <h2 style="font-size:18px;margin-top:0">
    ثبت‌های امروز
  </h2>

  <div id="entries"></div>

</section>


<!--
  این قسمت کارهایی را نمایش می‌دهد
  که شروع و پایان داشته‌اند.
-->
<section class="card">

  <h2 style="font-size:18px;margin-top:0">
    ثبت کارهای امروز
  </h2>

  <div id="tasks"></div>

</section>


<!--
  گزارش امروز را می‌سازد
  و سپس اطلاعات امروز را پاک می‌کند.
-->
<button
  class="report"
  id="report"
>
  گزارش امروز و پاک‌کردن اطلاعات
</button>


<!--
  پنجره‌ای که هنگام ثبت زمان یا شروع کار باز می‌شود.
-->
<dialog id="topicDialog">

  <h3 style="margin-top:0">
    موضوع چیست؟
  </h3>

  <input
    id="topic"
    maxlength="120"
    placeholder="مثلاً مطالعه KNN"
    autocomplete="off"
  >

  <!--
    هدف‌های انجام‌نشده اینجا به صورت
    پیشنهاد نمایش داده می‌شوند.
  -->
  <div id="goalSuggestions"></div>

  <div class="dialog-actions">

    <button id="cancel">
      لغو
    </button>

    <button
      class="primary"
      id="save"
    >
      ذخیره
    </button>

  </div>

</dialog>


<!--
  پنجره گزارش روزانه.
-->
<dialog id="reportDialog">

  <h3 style="margin-top:0">
    گزارش امروز
  </h3>

  <div id="reportText"></div>

  <div
    class="dialog-actions"
    style="margin-top:15px"
  >
    <button id="closeReport">
      بستن
    </button>
  </div>

</dialog>


<script>

/*
  ============================================================
  راهنمای کلی JavaScript
  ============================================================

  برنامه فعلاً کاملاً داخل مرورگر اجرا می‌شود.

  یعنی:

  HTML
      ↓
  ظاهر برنامه

  CSS
      ↓
  شکل و ظاهر برنامه

  JavaScript
      ↓
  منطق و رفتار برنامه

  localStorage
      ↓
  حافظه‌ای که اطلاعات برنامه در آن ذخیره می‌شود.


  ما سه نوع داده اصلی داریم:

  1. ثبت‌های لحظه‌ای
  2. کارهای بازه‌ای
  3. اهداف


  برای هر نوع داده یک کلید جداگانه داریم.
*/


/*
  ============================================================
  کلیدهای localStorage
  ============================================================
*/


// کلید مربوط به ثبت‌های لحظه‌ای
const KEY='time_tracker_entries_v1';


// تعداد میلی‌ثانیه‌های یک روز
// برای تشخیص ثبت‌های مربوط به ۲۴ ساعت اخیر استفاده می‌شود.
const DAY=24*60*60*1000;


// کلید مربوط به اهداف
const GOAL_KEY='time_tracker_goals_v1';


// کلید مربوط به کارهای بازه‌ای
const TASK_KEY='time_tracker_tasks_v1';


// اگر یک کار در حال انجام باشد، اطلاعاتش موقتاً اینجا قرار می‌گیرد.
//
// مثلاً:
//
// activeTask = {
//   topic: "مطالعه KNN",
//   start: 1720000000000
// }
//
// وقتی کار تمام شود، end هم اضافه می‌شود
// و کل رکورد داخل localStorage ذخیره می‌شود.
let activeTask=null;


// یک میانبر برای document.getElementById
//
// به جای:
//
// document.getElementById('topic')
//
// می‌توانیم بنویسیم:
//
// $('topic')
//
const $=id=>document.getElementById(id);


/*
  ============================================================
  ثبت‌های لحظه‌ای
  ============================================================
*/


// اطلاعات ثبت‌های لحظه‌ای را از localStorage می‌خواند.
//
// اگر چیزی وجود نداشته باشد:
// []
//
// همچنین فقط ثبت‌هایی را نگه می‌دارد
// که کمتر از ۲۴ ساعت از زمانشان گذشته باشد.
function load(){
  try{
    return JSON.parse(
      localStorage.getItem(KEY)||'[]'
    ).filter(
      e=>Date.now()-e.timestamp<DAY
    )
  }catch{
    return []
  }
}


// آرایه ثبت‌ها را به JSON تبدیل می‌کند
// و در localStorage ذخیره می‌کند.
function save(a){
  localStorage.setItem(
    KEY,
    JSON.stringify(a)
  )
}


// timestamp خام را به ساعت قابل‌خواندن تبدیل می‌کند.
//
// مثلاً:
//
// 1720000000000
//
// تبدیل می‌شود به چیزی شبیه:
//
// ۱۰:۳۰:۲۵
//
function fmt(ts){
  return new Date(ts).toLocaleTimeString(
    'fa-IR',
    {
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit'
    }
  )
}


/*
  ============================================================
  اهداف
  ============================================================
*/


// اهداف فردا را از localStorage می‌خواند.
function loadGoals(){
  try{
    return JSON.parse(
      localStorage.getItem(GOAL_KEY)||'[]'
    )
  }catch{
    return []
  }
}


// فهرست اهداف را در localStorage ذخیره می‌کند.
function saveGoals(a){
  localStorage.setItem(
    GOAL_KEY,
    JSON.stringify(a)
  )
}


/*
  ============================================================
  کارهای بازه‌ای
  ============================================================
*/


// کارهای ذخیره‌شده را می‌خواند.
function loadTasks(){
  try{
    return JSON.parse(
      localStorage.getItem(TASK_KEY)||'[]'
    )
  }catch{
    return []
  }
}


// فهرست کارهای بازه‌ای را ذخیره می‌کند.
//
// هر کار معمولاً چیزی شبیه این است:
//
// {
//   topic: "مطالعه KNN",
//   start: 1720000000000,
//   end: 1720005000000
// }
function saveTasks(a){
  localStorage.setItem(
    TASK_KEY,
    JSON.stringify(a)
  )
}


/*
  ============================================================
  نمایش اهداف
  ============================================================
*/


// این تابع فهرست اهداف را روی صفحه می‌سازد.
//
// خودش هدف جدید ایجاد نمی‌کند.
// فقط اطلاعاتی که در حافظه داریم را به HTML تبدیل می‌کند.
function renderGoals(){

  const box=$('goals');
  const a=loadGoals();

  // ابتدا محتوای قبلی را پاک می‌کنیم.
  box.innerHTML='';


  // اگر هیچ هدفی وجود نداشت،
  // پیام مناسب نشان می‌دهیم.
  if(!a.length){

    box.innerHTML=
      '<div class="empty">هنوز هدفی برای فردا تعیین نکرده‌ای.</div>';

    return;
  }


  // تک‌تک اهداف را بررسی می‌کنیم.
  a.forEach((g,i)=>{

    const r=document.createElement('div');

    r.className='row';


    /*
      برای هر هدف:

      checkbox
      متن هدف
      دکمه حذف
    */
    r.innerHTML=`
      <label
        style="display:flex;align-items:center;gap:10px;flex:1"
      >

        <input
          type="checkbox"
          ${g.done?'checked':''}
          data-goal-index="${i}"
          style="width:auto;margin:0"
        >

        <span class="topic"></span>

      </label>

      <button
        class="btn danger"
        data-delete-goal="${i}"
        style="flex:0 0 auto;padding:7px 10px"
      >
        حذف
      </button>
    `;


    // متن هدف را با textContent قرار می‌دهیم.
    //
    // این کار بهتر از قرار دادن مستقیم متن کاربر
    // داخل innerHTML است.
    r.querySelector('.topic').textContent=g.text;


    box.appendChild(r);

  });


  /*
    وقتی checkbox تغییر کند،
    وضعیت done همان هدف را تغییر می‌دهیم.
  */
  box
    .querySelectorAll('[data-goal-index]')
    .forEach(c=>{

      c.onchange=()=>{

        const a=loadGoals();

        a[+c.dataset.goalIndex].done=c.checked;

        saveGoals(a);

        renderGoals();

      }

    });


  /*
    دکمه حذف هر هدف.
  */
  box
    .querySelectorAll('[data-delete-goal]')
    .forEach(b=>{

      b.onclick=()=>{

        const a=loadGoals();

        a.splice(
          +b.dataset.deleteGoal,
          1
        );

        saveGoals(a);

        renderGoals();

      }

    });

}


/*
  ============================================================
  ثبت یک لحظه
  ============================================================
*/


// یک فعالیت لحظه‌ای را ثبت می‌کند.
//
// ساختار داده:
//
// {
//   timestamp: زمان,
//   topic: موضوع
// }
function saveTopic(topic){

  const a=load();


  // ثبت جدید را به انتهای آرایه اضافه می‌کنیم.
  a.push({
    timestamp:Date.now(),
    topic
  });


  // ذخیره در localStorage
  save(a);


  // بستن پنجره
  $('topicDialog').close();


  // به‌روزرسانی صفحه
  render();


  // به‌روزرسانی پیشنهادهای هدف
  renderGoalSuggestions();

}


/*
  ============================================================
  شروع یک کار بازه‌ای
  ============================================================
*/


// شروع کار.
//
// اینجا هنوز کار را در localStorage ذخیره نمی‌کنیم.
// فقط زمان شروع را در activeTask نگه می‌داریم.
//
// وقتی کار تمام شد، finishTask اجرا می‌شود.
function startTask(topicOverride){

  /*
    اگر topicOverride وجود داشته باشد
    از آن استفاده می‌کنیم.

    این قسمت برای وقتی مهم است که کاربر
    روی یکی از اهداف پیشنهادی کلیک می‌کند.

    مثلاً:

    startTask("مطالعه KNN")

    در این حالت دیگر لازم نیست متن input را بخوانیم.
  */
  const topic=(
    topicOverride??
    $('topic').value
  ).trim();


  // اگر موضوع خالی بود، کاری انجام نمی‌دهیم.
  if(!topic)return;


  // متن انتخاب‌شده را داخل input هم قرار می‌دهیم.
  $('topic').value=topic;


  // ساخت اطلاعات کار در حال انجام
  activeTask={
    topic,
    start:Date.now()
  };


  // پنجره بسته می‌شود.
  $('topicDialog').close();


  // متن دکمه تغییر می‌کند.
  $('taskTap').textContent='پایان کار';

}


/*
  ============================================================
  پایان یک کار
  ============================================================
*/


// وقتی کار تمام شد این تابع اجرا می‌شود.
function finishTask(){

  // اگر کاری در حال انجام نباشد، کاری نمی‌کنیم.
  if(!activeTask)return;


  /*
    حالا رکورد کامل می‌شود:

    topic
    start
    end
  */
  const task={
    topic:activeTask.topic,
    start:activeTask.start,
    end:Date.now()
  };


  // کارهای قبلی را می‌خوانیم.
  const a=loadTasks();


  // کار جدید را اضافه می‌کنیم.
  a.push(task);


  // ذخیره می‌کنیم.
  saveTasks(a);


  // دیگر کاری در حال انجام نیست.
  activeTask=null;


  // دکمه به حالت اولیه برمی‌گردد.
  $('taskTap').textContent='ثبت کار';


  // نمایش کارهای امروز به‌روزرسانی می‌شود.
  renderTasks();

}


/*
  ============================================================
  نمایش کارهای بازه‌ای
  ============================================================
*/


// کارهای ذخیره‌شده را روی صفحه نشان می‌دهد.
function renderTasks(){

  const box=$('tasks');

  box.innerHTML='';


  const a=loadTasks();


  // اگر کاری ثبت نشده باشد.
  if(!a.length){

    box.innerHTML=
      '<div class="empty">هنوز کار بازه‌ای ثبت نشده.</div>';

    return;
  }


  // نمایش تک‌تک کارها
  a.forEach(t=>{

    const r=document.createElement('div');

    r.className='row';


    r.innerHTML=`
      <span class="time">
        ${fmt(t.start)} تا ${fmt(t.end)}
      </span>

      <span class="topic"></span>
    `;


    // نام کار
    r.querySelector('.topic').textContent=t.topic;


    box.appendChild(r);

  });

}


/*
  ============================================================
  پیشنهاد اهداف
  ============================================================
*/


// حالت پنجره مشخص می‌کند که هدف انتخاب‌شده
// قرار است «ثبت زمان» باشد یا «شروع کار».
//
// mode:
// time
// task
//
// اگر mode مشخص نشود، از dialogMode استفاده می‌کنیم.
function renderGoalSuggestions(mode=dialogMode){

  const box=$('goalSuggestions');

  box.innerHTML='';


  /*
    فقط اهدافی را می‌گیریم که هنوز انجام نشده‌اند.

    slice(0,3)
    یعنی حداکثر سه هدف نشان داده می‌شود.
  */
  const matches=
    loadGoals()
      .filter(g=>!g.done)
      .slice(0,3);


  matches.forEach(g=>{

    const b=document.createElement('button');


    b.type='button';

    b.className='btn';


    b.style.cssText=
      'width:100%;margin-bottom:8px;text-align:right';


    b.textContent=g.text;


    /*
      وقتی روی یک هدف پیشنهادی کلیک شود:
    */
    b.onclick=()=>{


      /*
        اگر پنجره در حالت task باشد،
        هدف به عنوان یک «کار در حال انجام»
        شروع می‌شود.
      */
      if(mode==='task'){

        startTask(g.text);


        /*
          فقط اگر startTask واقعاً موفق شده باشد،
          هدف را انجام‌شده علامت می‌زنیم.
        */
        if(activeTask){

          const a=loadGoals();


          const index=
            a.findIndex(
              x=>x.text===g.text&&!x.done
            );


          if(index!==-1){

            a[index].done=true;

            saveGoals(a);

            renderGoals();

          }

        }

      }


      /*
        در حالت time:
        هدف به عنوان یک ثبت لحظه‌ای ذخیره می‌شود.
      */
      else{

        const a=loadGoals();


        const index=
          a.findIndex(
            x=>x.text===g.text&&!x.done
          );


        if(index!==-1){

          a[index].done=true;

          saveGoals(a);

          renderGoals();

        }


        saveTopic(g.text);

      }

    };


    box.appendChild(b);

  });

}


/*
  ============================================================
  نمایش ثبت‌های لحظه‌ای
  ============================================================
*/


// این تابع مسئول نمایش ثبت‌های ذخیره‌شده است.
//
// داده جدیدی تولید نمی‌کند.
// فقط داده موجود را به UI تبدیل می‌کند.
function render(){

  const box=$('entries');

  const a=load();


  /*
    دوباره ذخیره می‌کنیم تا موارد قدیمی‌تر از ۲۴ ساعت
    که load حذف کرده، از حافظه هم حذف شوند.
  */
  save(a);


  box.innerHTML='';


  // اگر چیزی ثبت نشده باشد.
  if(!a.length){

    box.innerHTML=
      '<div class="empty">هنوز چیزی ثبت نشده.</div>';

    return;
  }


  // نمایش ثبت‌ها
  a.forEach(e=>{

    const r=document.createElement('div');

    r.className='row';


    r.innerHTML=`
      <span class="time">
        ${fmt(e.timestamp)}
      </span>

      <span class="topic"></span>
    `;


    r.querySelector('.topic').textContent=e.topic;


    box.appendChild(r);

  });

}


/*
  ============================================================
  ساعت
  ============================================================
*/


// ساعت فعلی دستگاه را روی صفحه نشان می‌دهد.
function clock(){

  $('clock').textContent=
    new Date().toLocaleTimeString(
      'fa-IR',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      }
    );

}


/*
  ============================================================
  حالت پنجره
  ============================================================
*/


// مشخص می‌کند پنجره فعلی برای چه کاری باز شده.
//
// time
// یعنی ثبت زمان.
//
// task
// یعنی شروع یک کار.
let dialogMode='time';


// دکمه لغو
$('cancel').onclick=()=>{
  $('topicDialog').close();
};


// تابع مخصوص ثبت زمان از داخل پنجره
function saveTimeFromDialog(){

  const topic=$('topic').value.trim();


  if(!topic)return;


  saveTopic(topic);

}


// حالت پیش‌فرض دکمه ذخیره
$('save').onclick=saveTimeFromDialog;


/*
  ============================================================
  دکمه «ثبت زمان»
  ============================================================
*/


$('tap').onclick=()=>{

  // حالت پنجره = ثبت زمان
  dialogMode='time';


  // input را خالی می‌کنیم.
  $('topic').value='';


  // سه هدف پیشنهادی را نشان می‌دهیم.
  renderGoalSuggestions('time');


  // عملکرد دکمه ذخیره
  $('save').onclick=saveTimeFromDialog;


  // باز کردن پنجره
  $('topicDialog').showModal();


  // کمی بعد input را focus می‌کنیم.
  setTimeout(
    ()=>$('topic').focus(),
    50
  );

};


/*
  ============================================================
  دکمه «ثبت کار»
  ============================================================
*/


$('taskTap').onclick=()=>{

  /*
    اگر همین الان کاری در حال انجام باشد،
    کلیک روی دکمه یعنی «پایان کار».
  */
  if(activeTask){

    finishTask();

    return;

  }


  // در غیر این صورت می‌خواهیم یک کار جدید شروع کنیم.
  dialogMode='task';


  $('topic').value='';


  // هدف‌های پیشنهادی را در حالت task نشان می‌دهیم.
  renderGoalSuggestions('task');


  // دکمه ذخیره در این حالت startTask را اجرا می‌کند.
  $('save').onclick=()=>startTask();


  // نمایش پنجره
  $('topicDialog').showModal();


  setTimeout(
    ()=>$('topic').focus(),
    50
  );

};


/*
  ============================================================
  تغییر متن input
  ============================================================
*/


// وقتی کاربر شروع به تایپ می‌کند، پیشنهادهای هدف
// دوباره بر اساس حالت فعلی پنجره ساخته می‌شوند.
//
// نکته مهم:
// از dialogMode استفاده می‌کنیم تا اگر در حالت task هستیم،
// تایپ کردن باعث نشود برنامه دوباره وارد حالت time شود.
$('topic').oninput=()=>{
  renderGoalSuggestions(dialogMode);
};


/*
  ============================================================
  زدن Enter
  ============================================================
*/


// با زدن Enter همان کاری را می‌کند
// که دکمه ذخیره انجام می‌دهد.
$('topic').onkeydown=e=>{

  if(e.key==='Enter'){
    $('save').click();
  }

};


/*
  ============================================================
  افزودن هدف جدید
  ============================================================
*/


function addGoal(){

  // متن input را می‌گیریم.
  const text=$('goalInput').value.trim();


  // اگر خالی بود، کاری نمی‌کنیم.
  if(!text)return;


  // اهداف فعلی
  const a=loadGoals();


  /*
    هدف جدید:

    text = متن هدف
    done = false

    یعنی هنوز انجام نشده.
  */
  a.push({
    text,
    done:false
  });


  // ذخیره
  saveGoals(a);


  // خالی کردن input
  $('goalInput').value='';


  // نمایش دوباره اهداف
  renderGoals();

}


// کلیک روی «افزودن هدف»
$('addGoal').onclick=addGoal;


// Enter در input هدف
$('goalInput').onkeydown=e=>{

  if(e.key==='Enter'){
    addGoal();
  }

};


/*
  ============================================================
  گزارش روزانه
  ============================================================
*/


// وقتی روی گزارش کلیک شود:
$('report').onclick=()=>{


  // ثبت‌های لحظه‌ای
  const a=load();


  // کارهای بازه‌ای
  const t=loadTasks();


  /*
    ابتدا بخش ثبت‌های لحظه‌ای گزارش را می‌سازیم.
  */
  $('reportText').innerHTML=

    '<h4>ثبت زمان</h4>'+

    (
      a.length

      ?

      a.map(e=>`
        <div class="row">

          <span class="time">
            ${fmt(e.timestamp)}
          </span>

          <span class="topic"></span>

        </div>
      `).join('')

      :

      '<div class="empty">امروز موردی ثبت نشده.</div>'
    )+


    '<h4 style="margin-top:18px">ثبت کار</h4>'+
    '<div id="reportTasks"></div>';


  /*
    متن موضوع ثبت‌های لحظه‌ای را
    با textContent قرار می‌دهیم.
  */
  [
    ...$('reportText')
      .querySelectorAll('.topic')
  ]
  .forEach((n,i)=>{
    n.textContent=a[i].topic;
  });


  /*
    حالا بخش کارهای بازه‌ای گزارش را می‌سازیم.
  */
  const box=$('reportTasks');


  if(!t.length){

    box.innerHTML=
      '<div class="empty">هنوز کار بازه‌ای ثبت نشده.</div>';

  }


  else{

    t.forEach(x=>{

      const r=document.createElement('div');

      r.className='row';


      r.innerHTML=`
        <span class="time">
          ${fmt(x.start)} تا ${fmt(x.end)}
        </span>

        <span class="topic"></span>
      `;


      r.querySelector('.topic').textContent=x.topic;


      box.appendChild(r);

    });

  }


  /*
    گزارش ساخته شده،
    پس پنجره را نمایش می‌دهیم.
  */
  $('reportDialog').showModal();


  /*
    بعد از ساخته شدن گزارش،
    اطلاعات امروز پاک می‌شوند.

    خود گزارش داخل پنجره باقی می‌ماند،
    بنابراین کاربر می‌تواند آن را ببیند.
  */
  save([]);

  saveTasks([]);


  // صفحه اصلی هم به‌روزرسانی می‌شود.
  render();

  renderTasks();

};


// بستن گزارش
$('closeReport').onclick=()=>{
  $('reportDialog').close();
};


/*
  ============================================================
  شروع برنامه
  ============================================================

  وقتی صفحه برای اولین بار باز می‌شود:

  1. ساعت نمایش داده می‌شود.
  2. ساعت هر ثانیه آپدیت می‌شود.
  3. ثبت‌های امروز نمایش داده می‌شوند.
  4. اهداف نمایش داده می‌شوند.
  5. کارهای امروز نمایش داده می‌شوند.
  6. ثبت‌های لحظه‌ای هر ۶۰ ثانیه دوباره بررسی می‌شوند.
*/


clock();

setInterval(
  clock,
  1000
);


render();

renderGoals();

renderTasks();


setInterval(
  render,
  60000
);

</script>

</main>

</html>
