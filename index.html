<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Tracker</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light dark
}

body{
  margin:0;
  background:#f4f4f7;
  color:#17171a
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
  padding:24px 18px;
  box-sizing:border-box
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px
}

h1{
  font-size:25px;
  margin:0
}

.clock{
  font-variant-numeric:tabular-nums;
  font-size:18px;
  color:#666
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:24px;
  padding:22px;
  margin-bottom:16px
}

.center{
  text-align:center
}

.tap{
  width:190px;
  height:190px;
  border-radius:50%;
  border:0;
  background:#111;
  color:#fff;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 24px #0002
}

.tap:active{
  transform:scale(.97)
}

.sub{
  color:#777;
  font-size:14px;
  margin-top:14px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #eee
}

.row:last-child{
  border-bottom:0
}

.time{
  font-variant-numeric:tabular-nums;
  font-weight:700
}

.topic{
  color:#555
}

.actions{
  display:flex;
  gap:10px
}

.btn{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:1px solid #ccc;
  background:#fff;
  font-weight:600;
  cursor:pointer
}

.danger{
  color:#b00020
}

.empty{
  color:#777;
  text-align:center;
  padding:15px
}

.report{
  width:100%;
  padding:14px;
  border-radius:15px;
  border:0;
  background:#111;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

dialog{
  border:0;
  border-radius:22px;
  padding:22px;
  max-width:calc(100% - 44px);
  width:360px
}

dialog::backdrop{
  background:#0007
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
  margin:12px 0
}

.dialog-actions{
  display:flex;
  gap:10px
}

.dialog-actions button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:1px solid #ccc
}

.primary{
  background:#111!important;
  color:#fff;
  border-color:#111!important
}

@media(prefers-color-scheme:dark){
  body{
    background:#111;
    color:#eee
  }

  .card{
    background:#1c1c1e;
    border-color:#333
  }

  .btn,input{
    background:#242426;
    color:#eee;
    border-color:#444
  }

  .topic,.sub,.clock{
    color:#aaa
  }

  .row{
    border-color:#333
  }

  dialog{
    background:#1c1c1e;
    color:#eee
  }
}
</style>

</head>

<body>

<main class="app" id="app">

<header>
  <h1>ثبت زمان</h1>
  <div class="clock" id="clock">--:--:--</div>
</header>


<!--
  ============================================================
  دکمه اصلی ثبت زمان
  ============================================================

  با زدن این دکمه، پنجره‌ای باز می‌شود تا موضوع فعالیت را وارد کنیم.

  در نسخه فعلی هنوز «شروع فعالیت» و «پایان فعالیت» نداریم.
  فعلاً فقط لحظه‌ای که کاربر ثبت می‌کند ذخیره می‌شود.
-->
<section class="card center">

  <button class="tap" id="tap">
    ثبت زمان
  </button>

  <div class="sub">
    با هر ضربه، زمان فعلی ثبت می‌شود
  </div>

</section>


<!--
  ============================================================
  بخش اهداف فردا
  ============================================================

  هر هدف شامل دو اطلاعات اصلی است:

  text:
    متن هدف

  done:
    مشخص می‌کند هدف انجام شده یا نه.

  هدف‌های انجام‌نشده می‌توانند در پنجره ثبت فعالیت
  به عنوان پیشنهاد نمایش داده شوند.
-->
<section class="card">

  <h2 style="font-size:18px;margin-top:0">
    اهداف فردا
  </h2>

  <div class="actions">

    <input
      id="goalInput"
      maxlength="120"
      placeholder="مثلاً ۱ ساعت AI"
      autocomplete="off"
    >

    <button
      class="primary btn"
      id="addGoal"
    >
      افزودن هدف
    </button>

  </div>

  <div id="goals"></div>

</section>


<!--
  ============================================================
  ثبت‌های امروز
  ============================================================
-->
<section class="card">

  <h2 style="font-size:18px;margin-top:0">
    ثبت‌های امروز
  </h2>

  <div id="entries"></div>

</section>


<button class="report" id="report">
  گزارش امروز و پاک‌کردن اطلاعات
</button>


<!--
  ============================================================
  پنجره ثبت موضوع فعالیت
  ============================================================
-->
<dialog id="topicDialog">

  <h3 style="margin-top:0">
    موضوع چیست؟
  </h3>

  <input
    id="topic"
    maxlength="120"
    placeholder="مثلاً مطالعه KNN"
    autocomplete="off"
  >

  <div id="goalSuggestions"></div>

  <div class="dialog-actions">

    <button id="cancel">
      لغو
    </button>

    <button class="primary" id="save">
      ذخیره
    </button>

  </div>

</dialog>


<!--
  ============================================================
  پنجره گزارش روزانه
  ============================================================
-->
<dialog id="reportDialog">

  <h3 style="margin-top:0">
    گزارش امروز
  </h3>

  <div id="reportText"></div>

  <div
    class="dialog-actions"
    style="margin-top:15px"
  >

    <button id="closeReport">
      بستن
    </button>

  </div>

</dialog>


<script>

/*
  ============================================================
  راهنمای کلی JavaScript
  ============================================================

  این قسمت مغز برنامه است.

  HTML:
    ساختار صفحه را می‌سازد.

  CSS:
    ظاهر صفحه را کنترل می‌کند.

  JavaScript:
    رفتار برنامه را کنترل می‌کند.

  اطلاعات برنامه فعلاً داخل localStorage مرورگر ذخیره می‌شوند.

  بنابراین اطلاعات بعد از بستن صفحه هم باقی می‌مانند.

  وقتی قابلیت جدیدی اضافه کنیم، معمولاً باید مشخص کنیم:

    1. اطلاعات کجا ذخیره شوند؟
    2. چطور آنها را بخوانیم؟
    3. چطور آنها را روی صفحه نمایش دهیم؟
*/


/*
  ============================================================
  کلیدهای ذخیره‌سازی
  ============================================================

  KEY:
    برای ثبت‌های زمانی

  GOAL_KEY:
    برای اهداف فردا
*/

const KEY='time_tracker_entries_v1';

const DAY=24*60*60*1000;

const GOAL_KEY='time_tracker_goals_v1';


/*
  میانبر برای document.getElementById
*/

const $=id=>document.getElementById(id);


/*
  ============================================================
  خواندن ثبت‌های زمانی
  ============================================================

  localStorage اطلاعات را به صورت متن ذخیره می‌کند.

  JSON.parse متن را دوباره به آرایه تبدیل می‌کند.

  همچنین فقط اطلاعات مربوط به ۲۴ ساعت اخیر نگه داشته می‌شوند.
*/

function load(){

  try{

    return JSON.parse(
      localStorage.getItem(KEY)||'[]'
    ).filter(
      e=>Date.now()-e.timestamp<DAY
    );

  }catch{

    return [];

  }

}


/*
  ============================================================
  ذخیره ثبت‌های زمانی
  ============================================================
*/

function save(a){

  localStorage.setItem(
    KEY,
    JSON.stringify(a)
  );

}


/*
  ============================================================
  تبدیل timestamp به ساعت قابل خواندن
  ============================================================
*/

function fmt(ts){

  return new Date(ts).toLocaleTimeString(
    'fa-IR',
    {
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit'
    }
  );

}


/*
  ============================================================
  خواندن اهداف
  ============================================================
*/

function loadGoals(){

  try{

    return JSON.parse(
      localStorage.getItem(GOAL_KEY)||'[]'
    );

  }catch{

    return [];

  }

}


/*
  ============================================================
  ذخیره اهداف
  ============================================================
*/

function saveGoals(a){

  localStorage.setItem(
    GOAL_KEY,
    JSON.stringify(a)
  );

}


/*
  ============================================================
  نمایش اهداف
  ============================================================

  این تابع فقط مسئول نمایش اهداف روی صفحه است.

  خودش هدف جدید نمی‌سازد.
*/

function renderGoals(){

  const box=$('goals');

  const a=loadGoals();

  box.innerHTML='';


  if(!a.length){

    box.innerHTML=
      '<div class="empty">هنوز هدفی برای فردا تعیین نکرده‌ای.</div>';

    return;

  }


  a.forEach((g,i)=>{

    const r=document.createElement('div');

    r.className='row';


    r.innerHTML=`

      <label
        style="display:flex;align-items:center;gap:10px;flex:1"
      >

        <input
          type="checkbox"
          ${g.done?'checked':''}
          data-goal-index="${i}"
          style="width:auto;margin:0"
        >

        <span class="topic"></span>

      </label>


      <button
        class="btn danger"
        data-delete-goal="${i}"
        style="flex:0 0 auto;padding:7px 10px"
      >
        حذف
      </button>

    `;


    r.querySelector('.topic').textContent=g.text;

    box.appendChild(r);

  });


  /*
    تغییر وضعیت انجام‌شدن هدف
  */

  box
    .querySelectorAll('[data-goal-index]')
    .forEach(c=>{

      c.onchange=()=>{

        const a=loadGoals();

        a[+c.dataset.goalIndex].done=c.checked;

        saveGoals(a);

        renderGoals();

      };

    });


  /*
    حذف هدف
  */

  box
    .querySelectorAll('[data-delete-goal]')
    .forEach(b=>{

      b.onclick=()=>{

        const a=loadGoals();

        a.splice(
          +b.dataset.deleteGoal,
          1
        );

        saveGoals(a);

        renderGoals();

      };

    });

}


/*
  ============================================================
  ذخیره یک فعالیت
  ============================================================

  هر فعالیت فعلاً شامل:

    timestamp
    topic

  است.
*/

function saveTopic(topic){

  const a=load();

  a.push({
    timestamp:Date.now(),
    topic
  });

  save(a);

  $('topicDialog').close();

  render();

  renderGoalSuggestions();

}


/*
  ============================================================
  پیشنهاد اهداف
  ============================================================

  فقط اهدافی که هنوز انجام نشده‌اند نمایش داده می‌شوند.

  حداکثر سه هدف پیشنهاد می‌شود.
*/

function renderGoalSuggestions(){

  const box=$('goalSuggestions');

  box.innerHTML='';


  const matches=
    loadGoals()
      .filter(g=>!g.done)
      .slice(0,3);


  matches.forEach(g=>{

    const b=document.createElement('button');

    b.type='button';

    b.className='btn';

    b.style.cssText=
      'width:100%;margin-bottom:8px;text-align:right';

    b.textContent=g.text;


    b.onclick=()=>{

      const a=loadGoals();

      const index=
        a.findIndex(
          x=>x.text===g.text && !x.done
        );


      if(index!==-1){

        a[index].done=true;

        saveGoals(a);

        renderGoals();

      }


      saveTopic(g.text);

    };


    box.appendChild(b);

  });

}


/*
  ============================================================
  نمایش فعالیت‌های امروز
  ============================================================
*/

function render(){

  const box=$('entries');

  const a=load();

  save(a);

  box.innerHTML='';


  if(!a.length){

    box.innerHTML=
      '<div class="empty">هنوز چیزی ثبت نشده.</div>';

    return;

  }


  a.forEach(e=>{

    const r=document.createElement('div');

    r.className='row';


    r.innerHTML=`

      <span class="time">
        ${fmt(e.timestamp)}
      </span>

      <span class="topic"></span>

    `;


    r.querySelector('.topic').textContent=e.topic;

    box.appendChild(r);

  });

}


/*
  ============================================================
  ساعت
  ============================================================
*/

function clock(){

  $('clock').textContent=
    new Date().toLocaleTimeString(
      'fa-IR',
      {
        hour:'2-digit',
        minute:'2-digit',
        second:'2-digit'
      }
    );

}


/*
  ============================================================
  دکمه اصلی ثبت زمان
  ============================================================
*/

$('tap').onclick=()=>{

  $('topic').value='';

  $('topicDialog').showModal();

  setTimeout(
    ()=>$('topic').focus(),
    50
  );

};


/*
  لغو ثبت
*/

$('cancel').onclick=()=>
  $('topicDialog').close();


/*
  ============================================================
  ذخیره فعالیت
  ============================================================
*/

$('save').onclick=()=>{

  const topic=
    $('topic').value.trim();

  if(!topic)
    return;


  const a=load();

  a.push({
    timestamp:Date.now(),
    topic
  });


  save(a);

  $('topicDialog').close();

  render();

};


/*
  با تغییر متن، پیشنهادهای هدف دوباره نمایش داده می‌شوند.
*/

$('topic').oninput=
  renderGoalSuggestions;


/*
  Enter = ذخیره
*/

$('topic').onkeydown=e=>{

  if(e.key==='Enter')
    $('save').click();

};


/*
  ============================================================
  اضافه کردن هدف
  ============================================================
*/

function addGoal(){

  const text=
    $('goalInput').value.trim();

  if(!text)
    return;


  const a=loadGoals();

  a.push({
    text,
    done:false
  });


  saveGoals(a);

  $('goalInput').value='';

  renderGoals();

}


$('addGoal').onclick=
  addGoal;


/*
  Enter داخل input هدف
*/

$('goalInput').onkeydown=e=>{

  if(e.key==='Enter')
    addGoal();

};


/*
  ============================================================
  گزارش امروز
  ============================================================

  گزارش ساخته می‌شود،
  سپس ثبت‌های امروز پاک می‌شوند.
*/

$('report').onclick=()=>{

  const a=load();


  $('reportText').innerHTML=

    a.length

      ? a
          .map(
            e=>`

              <div class="row">

                <span class="time">
                  ${fmt(e.timestamp)}
                </span>

                <span class="topic"></span>

              </div>

            `
          )
          .join('')

      : '<div class="empty">امروز موردی ثبت نشده.</div>';


  [
    ...$('reportText')
      .querySelectorAll('.topic')
  ]
  .forEach(
    (n,i)=>
      n.textContent=a[i].topic
  );


  $('reportDialog').showModal();


  save([]);

  render();

};


/*
  بستن گزارش
*/

$('closeReport').onclick=()=>
  $('reportDialog').close();


/*
  ============================================================
  اجرای اولیه برنامه
  ============================================================

  ساعت:
    هر یک ثانیه

  ثبت‌ها:
    هر ۶۰ ثانیه

  اهداف:
    هنگام باز شدن صفحه
*/

clock();

setInterval(
  clock,
  1000
);

render();

renderGoals();

setInterval(
  render,
  60000
);

</script>

</main>

</body>
</html>
