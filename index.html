<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Tracker</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:#f4f4f7;color:#17171a}.app{max-width:560px;margin:auto;min-height:100vh;padding:24px 18px;box-sizing:border-box}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}h1{font-size:25px;margin:0}.clock{font-variant-numeric:tabular-nums;font-size:18px;color:#666}.card{background:#fff;border:1px solid #ddd;border-radius:24px;padding:22px;margin-bottom:16px}.center{text-align:center}.tap{width:190px;height:190px;border-radius:50%;border:0;background:#111;color:#fff;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px #0002}.tap:active{transform:scale(.97)}.sub{color:#777;font-size:14px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.time{font-variant-numeric:tabular-nums;font-weight:700}.topic{color:#555}.actions{display:flex;gap:10px}.btn{flex:1;padding:13px;border-radius:14px;border:1px solid #ccc;background:#fff;font-weight:600;cursor:pointer}.danger{color:#b00020}.empty{color:#777;text-align:center;padding:15px}.report{width:100%;padding:14px;border-radius:15px;border:0;background:#111;color:#fff;font-weight:700;cursor:pointer}dialog{border:0;border-radius:22px;padding:22px;max-width:calc(100% - 44px);width:360px}dialog::backdrop{background:#0007}input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #ccc;font-size:16px;margin:12px 0} .dialog-actions{display:flex;gap:10px}.dialog-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid #ccc}.primary{background:#111!important;color:#fff;border-color:#111!important}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}.card{background:#1c1c1e;border-color:#333}.btn,input{background:#242426;color:#eee;border-color:#444}.topic,.sub,.clock{color:#aaa}.row{border-color:#333}dialog{background:#1c1c1e;color:#eee}}
</style></head>
<body><main class="app" id="app">
<header><h1>ثبت زمان</h1><div class="clock" id="clock">--:--:--</div></header>
<section class="card center"><button class="tap" id="tap">ثبت زمان</button><div class="sub">با هر ضربه، زمان فعلی ثبت می‌شود</div></section>
<section class="card"><h2 style="font-size:18px;margin-top:0">ثبت‌های امروز</h2><div id="entries"></div></section>
<button class="report" id="report">گزارش امروز و پاک‌کردن اطلاعات</button>
<dialog id="topicDialog"><h3 style="margin-top:0">موضوع چیست؟</h3><input id="topic" maxlength="120" placeholder="مثلاً مطالعه KNN" autocomplete="off"><div class="dialog-actions"><button id="cancel">لغو</button><button class="primary" id="save">ذخیره</button></div></dialog>
<dialog id="reportDialog"><h3 style="margin-top:0">گزارش امروز</h3><div id="reportText"></div><div class="dialog-actions" style="margin-top:15px"><button id="closeReport">بستن</button></div></dialog>
<script>
const KEY='time_tracker_entries_v1';
const DAY=24*60*60*1000;
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').filter(e=>Date.now()-e.timestamp<DAY)}catch{return []}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function fmt(ts){return new Date(ts).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function render(){const box=$('entries'), a=load(); save(a); box.innerHTML=''; if(!a.length){box.innerHTML='<div class="empty">هنوز چیزی ثبت نشده.</div>';return} a.forEach(e=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="time">${fmt(e.timestamp)}</span><span class="topic"></span>`;r.querySelector('.topic').textContent=e.topic;box.appendChild(r)})}
function clock(){$('clock').textContent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
$('tap').onclick=()=>{$('topic').value='';$('topicDialog').showModal();setTimeout(()=>$('topic').focus(),50)};
$('cancel').onclick=()=>$('topicDialog').close();
$('save').onclick=()=>{const topic=$('topic').value.trim();if(!topic)return;const a=load();a.push({timestamp:Date.now(),topic});save(a);$('topicDialog').close();render()};
$('topic').onkeydown=e=>{if(e.key==='Enter')$('save').click()};
$('report').onclick=()=>{const a=load();$('reportText').innerHTML=a.length?a.map(e=>`<div class="row"><span class="time">${fmt(e.timestamp)}</span><span class="topic"></span></div>`).join(''):'<div class="empty">امروز موردی ثبت نشده.</div>';[...$('reportText').querySelectorAll('.topic')].forEach((n,i)=>n.textContent=a[i].topic);$('reportDialog').showModal();save([]);render()};
$('closeReport').onclick=()=>$('reportDialog').close();
clock();setInterval(clock,1000);render();setInterval(render,60000);
</script></main></body></html>
